name: Rust

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: '0'
  AWS_REGION: us-west-2
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  id-token: write   # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout

jobs:
  fmt:
    name: Formatting check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
    - name: Install Rust nightly
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: nightly
        components: "rustfmt"
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2.9.1
      with:
        shared-key: ascii-casing-ci-${{ github.head_ref || github.ref_name }}
    - name: Run formatting check.
      run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
    - name: Install Rust nightly
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: nightly
        components: "clippy"
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2.9.1
      with:
        shared-key: ascii-casing-ci-${{ github.head_ref || github.ref_name }}
    - name: Run Clippy check.
      run: cargo clippy -- -Dwarnings

  test:
    name: Tests and coverage (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: no-features
          features: ''
        - name: alloc
          features: 'alloc'
        - name: serde
          features: 'serde'
        - name: serde-alloc
          features: 'serde,alloc'
        - name: all-features
          features: 'std,serde'
    env:
      RUSTFLAGS: '-Ccodegen-units=1 -Cinstrument-coverage -Copt-level=0'
      RUSTDOCFLAGS: '-Ccodegen-units=1 -Cinstrument-coverage -Copt-level=0'
    steps:
    - uses: actions/checkout@v6
    - id: aws_creds
      name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6.0.0
      with:
        role-to-assume: arn:aws:iam::557925715019:role/github-actions
        role-session-name: ascii-casing
        aws-region: ${{ env.AWS_REGION }}
    - name: Install Rust nightly
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: nightly
        components: "llvm-tools"
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2.9.1
      with:
        shared-key: ascii-casing-ci-${{ github.head_ref || github.ref_name }}
        key: ${{ matrix.name }}
    - name: Install cargo-llvm-cov
      run: cargo install cargo-llvm-cov
    - name: Run tests and gather coverage data
      env:
        RUST_LOG: debug
      run: cargo llvm-cov --tests --no-default-features --features '${{ matrix.features }}' --html --output-dir coverage-report
    - name: Upload coverage report to AWS
      run: aws s3 sync coverage-report/html s3://${{ secrets.COVERAGE_S3_BUCKET }}/coverage/ascii-casing/${{ github.run_number }}/${{ matrix.name }} --no-progress

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
    - id: aws_creds
      name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6.0.0
      with:
        role-to-assume: arn:aws:iam::557925715019:role/github-scratchstack-actions
        role-session-name: github-scratchstack-actions
        aws-region: ${{ env.AWS_REGION }}
    - name: Install Rust nightly
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: nightly
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2.9.1
      with:
        shared-key: ascii-casing-ci-${{ github.head_ref || github.ref_name }}
    - name: Build documentation
      run: cargo doc --no-deps
    - name: Upload documentation to AWS
      run: |
        cp index.html target/doc/index.html
        aws s3 sync target/doc s3://${{ secrets.COVERAGE_S3_BUCKET }}/docs/ascii-casing/${{ github.run_number }} --no-progress
